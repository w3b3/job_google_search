version: '3.8'

services:
  # Next.js Frontend (Development Mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      - DATABASE_URL=sqlite:/app/data/jobsearch.db
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration for Queue
      - REDIS_URL=redis://redis:6379
      
      # Google API Configuration (Backend managed)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # NextAuth Configuration
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Usage Limits
      - FREE_USER_SEARCH_LIMIT=${FREE_USER_SEARCH_LIMIT:-2}
      - PAID_USER_SEARCH_LIMIT=${PAID_USER_SEARCH_LIMIT:--1}
      
      # Development Configuration
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      
    depends_on:
      - redis
    volumes:
      # SQLite database persistence
      - sqlite_data:/app/data
      # Live reload for development
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: unless-stopped
    networks:
      - job-search-network

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - job-search-network

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local

networks:
  job-search-network:
    driver: bridge
