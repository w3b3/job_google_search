# Development Docker Compose Override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# 
# This configuration provides:
# - Live reload for source code changes
# - Development-optimized containers
# - Exposed Redis port for debugging
# - Volume mounts for real-time development

version: '3.8'

services:
  # Next.js Web Application (Development Mode)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Override for development
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Live reload for development - mount source code
      - ./src:/app/src:cached
      - ./public:/app/public:cached
      - ./package.json:/app/package.json:ro
      - ./next.config.js:/app/next.config.js:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Exclude node_modules from host
      - /app/node_modules
    command: ["npm", "run", "dev"]

  # Background Worker (Development Mode)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "worker"]
    environment:
      # Override for development
      - NODE_ENV=development
    volumes:
      # Live reload for development
      - ./src:/app/src:cached
      # Exclude node_modules from host
      - /app/node_modules

  # Redis (Development Mode)
  redis:
    ports:
      # Expose Redis port for local development tools
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

# Development-specific volumes with better performance
volumes:
  sqlite_data:
    # Use named volume for better performance in development
    driver: local
  redis_data:
    driver: local