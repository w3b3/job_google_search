# Job Search Analyzer - Development Configuration
# Single docker-compose for all development needs

version: '3.8'

services:
  # Next.js Web Application (Development Mode with Live Reload)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      - DATABASE_URL=sqlite:/app/data/jobsearch.db
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration for Queue Management
      - REDIS_URL=redis://redis:6379
      
      # Google API Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # NextAuth Configuration
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Usage Limits
      - FREE_USER_SEARCH_LIMIT=${FREE_USER_SEARCH_LIMIT:-2}
      - PAID_USER_SEARCH_LIMIT=${PAID_USER_SEARCH_LIMIT:--1}
      
      # Development Configuration
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      
    depends_on:
      - redis
    volumes:
      # SQLite database persistence
      - sqlite_data:/app/data
      # Live reload for development - mount source code
      - ./src:/app/src:cached
      - ./public:/app/public:cached
      - ./package.json:/app/package.json:ro
      - ./next.config.js:/app/next.config.js:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Exclude node_modules from host
      - /app/node_modules
    restart: unless-stopped
    networks:
      - job-search-network
    command: ["npm", "run", "dev"]

  # Background Worker for Job Processing (Development Mode)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    environment:
      # Database Configuration
      - DATABASE_URL=sqlite:/app/data/jobsearch.db
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      
      # Google API Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # Development Configuration
      - NODE_ENV=development
      
    depends_on:
      - redis
    volumes:
      # Shared SQLite database with web application
      - sqlite_data:/app/data
      # Live reload for development
      - ./src:/app/src:cached
      # Exclude node_modules from host
      - /app/node_modules
    restart: unless-stopped
    networks:
      - job-search-network

  # Redis for Queue Management and Caching
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"  # Exposed for development tools
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - job-search-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

# Development volumes with good performance
volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local

# Network for service communication
networks:
  job-search-network:
    driver: bridge