version: '3.8'

services:
  job-search-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Load environment variables from .env file
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      # Mount source code for development (comment out for production)
      - .:/usr/src/app
      - /usr/src/app/node_modules
    # Uncomment the next line if you want to keep the container running for debugging
    # tty: true
    # stdin_open: true
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
