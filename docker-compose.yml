# Production Docker Compose Configuration
# Job Search Analyzer - Next.js Application with Background Processing

version: '3.8'

services:
  # Next.js Web Application (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      - DATABASE_URL=sqlite:/app/data/jobsearch.db
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration for Queue Management
      - REDIS_URL=redis://redis:6379
      
      # Google API Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # NextAuth Configuration
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Usage Limits
      - FREE_USER_SEARCH_LIMIT=${FREE_USER_SEARCH_LIMIT:-2}
      - PAID_USER_SEARCH_LIMIT=${PAID_USER_SEARCH_LIMIT:--1}
      
      # Production Configuration
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      
    depends_on:
      - redis
    volumes:
      # SQLite database persistence
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - job-search-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background Worker for Job Processing
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/lib/worker.js"]
    environment:
      # Database Configuration
      - DATABASE_URL=sqlite:/app/data/jobsearch.db
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      
      # Google API Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # Worker Configuration
      - NODE_ENV=production
      
    depends_on:
      - redis
    volumes:
      # Shared SQLite database with web application
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - job-search-network

  # Redis for Queue Management and Caching
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - job-search-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

# Persistent volumes for data storage
volumes:
  sqlite_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/sqlite
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis

# Network for service communication
networks:
  job-search-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16