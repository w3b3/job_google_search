version: '3.8'

services:
  # Next.js Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.simple
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      - DATABASE_URL=sqlite:/app/data/jobsearch.db
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration for Queue
      - REDIS_URL=redis://redis:6379
      
      # Google API Configuration (Backend managed)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # NextAuth Configuration
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Usage Limits
      - FREE_USER_SEARCH_LIMIT=${FREE_USER_SEARCH_LIMIT:-2}
      - PAID_USER_SEARCH_LIMIT=${PAID_USER_SEARCH_LIMIT:--1}
      
      # Application Configuration
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      
    depends_on:
      - redis
    volumes:
      # SQLite database persistence
      - sqlite_data:/app/data
      # Optional: Mount uploads directory for file exports
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - job-search-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Background Worker for Job Processing
  worker:
    build:
      context: ./frontend
      dockerfile: Dockerfile  # Use the full Dockerfile with Puppeteer for worker
    command: ["node", "-r", "tsx/cjs", "src/lib/worker.ts"]
    environment:
      # Database Configuration
      - DATABASE_URL=sqlite:/app/data/jobsearch.db
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      
      # Google API Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # Job Search Configuration
      - JOB_QUERY=${JOB_QUERY:-("engineering manager" OR "engineering lead") remote}
      - TIME_FILTER_DAYS=${TIME_FILTER_DAYS:-15}
      - MAX_RESULTS_PER_QUERY=${MAX_RESULTS_PER_QUERY:-10}
      - KEYWORDS_TO_FIND=${KEYWORDS_TO_FIND:-stripe,payment,payments,fintech,billing,checkout}
      - MIN_KEYWORD_MATCHES=${MIN_KEYWORD_MATCHES:-1}
      - ATS_PLATFORMS=${ATS_PLATFORMS:-ashby,greenhouse,lever,powered_ashby,powered_greenhouse,powered_lever}
      
      # Browser Configuration
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - PAGE_TIMEOUT=${PAGE_TIMEOUT:-20000}
      - REQUEST_DELAY=${REQUEST_DELAY:-1000}
      
      # Worker Configuration
      - NODE_ENV=production
      
    depends_on:
      - redis
    volumes:
      # Shared SQLite database with frontend
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - job-search-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - job-search-network
    deploy:
      resources:
        limits:
          memory: 512M

  # CLI Job Search Analyzer (Optional - for one-off searches)
  cli-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Google API Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # Job Search Configuration
      - JOB_QUERY=${JOB_QUERY:-("engineering manager" OR "engineering lead") remote}
      - TIME_FILTER_DAYS=${TIME_FILTER_DAYS:-15}
      - MAX_RESULTS_PER_QUERY=${MAX_RESULTS_PER_QUERY:-10}
      - KEYWORDS_TO_FIND=${KEYWORDS_TO_FIND:-stripe,payment,payments,fintech,billing,checkout}
      - MIN_KEYWORD_MATCHES=${MIN_KEYWORD_MATCHES:-1}
      - ATS_PLATFORMS=${ATS_PLATFORMS:-ashby,greenhouse,lever,powered_ashby,powered_greenhouse,powered_lever}
      
      # Browser Configuration
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - PAGE_TIMEOUT=${PAGE_TIMEOUT:-20000}
      - REQUEST_DELAY=${REQUEST_DELAY:-1000}
      
      # Environment Configuration
      - NODE_ENV=${NODE_ENV:-production}
    profiles:
      - cli  # Only start with --profile cli
    networks:
      - job-search-network

  # Redis Commander (Optional - for Redis monitoring)
  redis-commander:
    image: rediscommander/redis-commander:latest
    hostname: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - job-search-network
    profiles:
      - monitoring
    restart: unless-stopped

  # SQLite Browser (Optional - for database browsing)
  sqlite-web:
    image: coleifer/sqlite-web:latest
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/data
    command: ["sqlite_web", "/data/jobsearch.db", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      - job-search-network
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local

networks:
  job-search-network:
    driver: bridge
