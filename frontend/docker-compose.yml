version: '3.8'

services:
  # Next.js Application
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # SQLite Database Configuration
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/jobsearch.db}
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      
      # Google API Configuration (required)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # Application Configuration
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      
    depends_on:
      - redis
    volumes:
      # SQLite database persistence
      - sqlite_data:/app/data
      # Optional: Mount uploads directory for file exports
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - job-search-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "-r", "tsx/cjs", "src/lib/worker.ts"]
    environment:
      # SQLite Database Configuration
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/jobsearch.db}
      - SQLITE_DATA_DIR=/app/data
      
      # Redis Configuration
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      
      # Google API Configuration (required)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      
      # Worker Configuration
      - NODE_ENV=production
      
    depends_on:
      - redis
    volumes:
      # Shared SQLite database with main app
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - job-search-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - job-search-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Redis Commander (Optional - for Redis monitoring)
  redis-commander:
    image: rediscommander/redis-commander:latest
    hostname: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - job-search-network
    profiles:
      - monitoring
    restart: unless-stopped

  # SQLite Browser (Optional - for SQLite database browsing)
  sqlite-web:
    image: coleifer/sqlite-web:latest
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/data
    command: ["sqlite_web", "/data/jobsearch.db", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      - job-search-network
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local

networks:
  job-search-network:
    driver: bridge
